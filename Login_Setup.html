<!DOCTYPE html>

    <style>
        body {
            background: #ecf0f3;

        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ecf0f3;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 10px 10px 20px #cbced1, -10px -10px 20px #ffffff;

        }

        .input-group { margin-bottom: 15px; }
        label { font-weight: 600; font-size: 14px; color: #555; display: block; margin-bottom: 5px; }
        
        input {
            width: 100%;
            padding: 10px;
            border: none;
            outline: none;
            background: #ecf0f3;
            border-radius: 10px;
            box-shadow: inset 5px 5px 10px #cbced1, inset -5px -5px 10px #ffffff;
            font-size: 14px;
            box-sizing: border-box;
        }

        .btn-save {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 50px;
            background: #1da1f2;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 5px 5px 10px #cbced1, -5px -5px 10px #ffffff;
            transition: 0.3s;
        }
        .btn-save:hover { background: #0d8bd1; transform: translateY(-2px); }
        .btn-back { display: block; text-align: center; margin-top: 15px; color: #555; text-decoration: none; }

        .status { text-align: center; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2><i class="fas fa-cogs"></i> Login Page Setup</h2>

        <!-- Credential Setup -->
        <h3 class="section-title">User Login Credentials</h3>
        <div class="input-group">
            <label>Loved One's Full Name (Username)</label>
            <input type="text" id="target-name" placeholder="Ex: Rafsan Jani">
        </div>
        <div class="input-group">
            <label>Login Password</label>
            <input type="text" id="target-pass" placeholder="Ex: iloveyou123">
        </div>

        <!-- Image Setup -->
        <h3 class="section-title">Top Images (5 Logos)</h3>
        
        <!-- Center Image (Main) -->
        <div class="input-group" style="border: 2px solid #1da1f2; padding: 10px; border-radius: 10px;">
            <label style="color: #1da1f2;">1. Center Main Image (Big)</label>
            <input type="text" id="img-center-url" placeholder="Image URL">
            <input type="text" id="img-center-txt" placeholder="Name below image" style="margin-top: 5px;">
        </div>

        <!-- Left 1 -->
        <div class="input-group">
            <label>2. Left Image 1</label>
            <input type="text" id="img-l1-url" placeholder="Image URL">
            <input type="text" id="img-l1-txt" placeholder="Name">
        </div>
        <!-- Left 2 -->
        <div class="input-group">
            <label>3. Left Image 2</label>
            <input type="text" id="img-l2-url" placeholder="Image URL">
            <input type="text" id="img-l2-txt" placeholder="Name">
        </div>
        <!-- Right 1 -->
        <div class="input-group">
            <label>4. Right Image 1</label>
            <input type="text" id="img-r1-url" placeholder="Image URL">
            <input type="text" id="img-r1-txt" placeholder="Name">
        </div>
        <!-- Right 2 -->
        <div class="input-group">
            <label>5. Right Image 2</label>
            <input type="text" id="img-r2-url" placeholder="Image URL">
            <input type="text" id="img-r2-txt" placeholder="Name">
        </div>

        <button class="btn-save" onclick="saveLoginSettings()">SAVE LOGIN SETTINGS</button>
        <a href="admin.home.html" class="btn-back">Back to Dashboard</a>
        <p class="status" id="status-msg"></p>
    </div>
